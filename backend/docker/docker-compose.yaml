services:
  erp:
    container_name: erp
    image: gogoshine/erp:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "30000:30000"
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      # 非敏感配置：直接在 compose 中声明（与 config.applyEnvOverrides 变量名一致）
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: 30000
      SERVER_MODE: release
      LOGGER_LEVEL: info
      LOGGER_FORMAT: json
      LOGGER_FILENAME: logs/erp.log
      LOGGER_MAX_SIZE: 10
      LOGGER_MAX_BACKUPS: 10
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: Asia/Shanghai
      DATABASE_MAX_IDLE_CONNS: 10
      DATABASE_MAX_OPEN_CONNS: 100
      # 敏感配置（DATABASE_* / COS_*）由 .env 注入
      TZ: Asia/Shanghai
    networks:
      - erp-net

networks:
  erp-net:
    driver: bridge
