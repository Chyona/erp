name: Build

on:
  push:
    tags:
      - 'v*'  # 匹配所有以 v 开头的 tag，如 v1.0.0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
    - name: 准备代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 检测 frontend 是否有变更
      id: filter
      run: |
        CURRENT="${GITHUB_REF_NAME}"
        PREV="$(git tag -l 'v*' --sort=-v:refname | awk -v cur="$CURRENT" '$0 != cur { print; exit }')"
        if [ -z "$PREV" ]; then
          echo "无上一版本 tag，将打包 frontend"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "对比范围: $PREV -> $CURRENT (frontend/)"
        if git diff --quiet "$PREV" "$CURRENT" -- frontend/; then
          echo "frontend/ 无变更，跳过打包"
          echo "frontend=false" >> "$GITHUB_OUTPUT"
        else
          echo "frontend/ 有变更，需要打包"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
        fi

  backend:
    name: Build And Push Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: 准备代码
      uses: actions/checkout@v4

    - name: 准备打包 Docker 镜像的环境
      uses: docker/setup-buildx-action@v3

    - name: 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 提取镜像标签
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ secrets.DOCKERHUB_USERNAME }}/erp
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern=v{{version}}
          type=sha,format=short
          type=raw,value=latest

    - name: 构建并推送 Docker 镜像
      uses: docker/build-push-action@v5
      with:
        # go.mod / cmd 在 backend/，Dockerfile 在 backend/docker/
        context: ./backend
        file: ./backend/docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  frontend:
    name: Build Frontend Dist
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: 准备代码
      uses: actions/checkout@v4

    - name: 安装 pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.10.0

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: 安装依赖
      run: pnpm install --frozen-lockfile

    - name: 构建前端
      run: pnpm build

    - name: 打包 dist.tar.gz
      run: tar -czf dist.tar.gz -C dist .

    - name: 上传前端产物
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist-${{ github.ref_name }}
        path: frontend/dist.tar.gz
        if-no-files-found: error
